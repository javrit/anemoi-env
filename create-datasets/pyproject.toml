[project]
name = "create-datasets"
version = "0.3.0"
dependencies = [
    "torch==2.5.1",
    "numcodecs==0.13.1",
    "anemoi-datasets==0.5.25",
    "anemoi-training==0.5.1",
    "anemoi-models==0.8.1",
    "anemoi-graphs==0.6.2",
    "anemoi-inference>=0.7.1",
    "mlflow-export-import>=1.2.0",
    "trimesh>=4.6.13",
    "metplotlib",
    "pyqt5==5.15.10",
]
requires-python = ">=3.11, <3.12"

[tool.uv.sources]
metplotlib = { git = "https://github.com/ThomasRieutord/metplotlib", tag = "v0.1.3" }
mlflow-export-import = { git = "https://github.com/mlflow/mlflow-export-import/"}
