[build-system]
requires = [ "setuptools>=60", "setuptools-scm>=8" ]
build-backend = "setuptools.build_meta"

[project]
name = "anemoi-env"
description = "A package to hold various functions to support training and inference of ML models."
keywords = [ "ai", "tools", "training" ]
license = { file = "LICENSE" }
authors = [
  { name = "European Centre for Medium-Range Weather Forecasts (ECMWF)", email = "software.support@ecmwf.int" },
]
requires-python = ">=3.11,<3.14"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = [ "version" ]

dependencies = [
  "anemoi-datasets",
  "anemoi-graphs>=0.5.2",
  "anemoi-models[migrations] >= 0.9.5",
  "anemoi-transform>=0.1.23",
  "anemoi-training",
  "anemoi-inference",
  "anemoi-utils[mlflow,provenance]>=0.4.37",
  "datashader>=0.16.3,<0.17; python_version<'3.10'",
  "datashader>=0.17; python_version>='3.10'",
  "einops>=0.6.1",
  "hydra-core>=1.3",
  "matplotlib>=3.7.1",
  "mlflow>=3.6.0",
  "mlflow-skinny>=2.11.1",
  "numpy<2",
  "nvidia-ml-py>=13.580.82",
  "pydantic>=2.9",
  "pyshtools>=4.13",
  "pytorch-lightning>=2.1",
  "tabulate>=0.9.0",
  "timm>=0.9.2",
  "torch>=2.2,<2.4",
  "torch-geometric>=2.3.1",
  "torchinfo>=1.8",
  "torchvision>=0.18",
  "tqdm>=4.65",
  "trimesh>=4.9.0",
  "zarr>=2.14.2",
  "earthkit>=0.13.2",
  "xarray>=2025.6.1",
  "seaborn>=0.13.2",
  "anemoi-mf-transform-plugins",
  "eccodeslib",
  "scipy>=1.16.3",
]

[tool.uv.sources]
mlflow-export-import = { git = "https://github.com/mlflow/mlflow-export-import/" }
anemoi-datasets = { git = "https://github.com/ecmwf/anemoi-datasets", branch = "main" }
anemoi-models = { git = "https://github.com/javrit/anemoi-core", subdirectory = "models", branch = "main" }
anemoi-training = { git = "https://github.com/javrit/anemoi-core", subdirectory = "training", branch = "main" }
anemoi-inference = { git = "https://github.com/javrit/anemoi-inference", branch = "main" }
anemoi-mf-transform-plugins = { git = "https://github.com/javrit/anemoi-inference", subdirectory = "anemoi-transform", branch = "main" }

[dependency-groups]
dev = [
    "ruff==0.13.2",
]

[datasets]
path = [
  "/project/home/p200177/DE_371/datasets/arome-an-oper-titan-0p025-2020-2024-1h-v4-eurw-precip6/arome-an-oper-titan-0p025-2020-2024-1h-v4-eurw-precip6/arome-an-oper-titan-0p025-2020-2024-1h-v4-eurw-precip6.zarr"
]